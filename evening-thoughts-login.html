<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Evening Thoughts – Login</title>
  <style>
    :root {
      --sky-top: #ece3f4;
      --sky-bottom: #f6d9c9;
      --card: rgba(255, 255, 255, 0.72);
      --card-border: rgba(80, 60, 120, 0.18);
      --ink: #2a2147;
      --ink-soft: #63587f;
      --field: #ffffff;
      --field-border: #bfb4d6;
      --accent: #4b3a8f;
      --accent-ink: #ffffff;
      --glow: #f2a65a;
      --error: #a3243b;
      --ok: #1f6b4a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --sky-top: #14152e;
        --sky-bottom: #4a2c58;
        --card: rgba(24, 22, 48, 0.72);
        --card-border: rgba(242, 200, 121, 0.22);
        --ink: #f3ece2;
        --ink-soft: #b9afcf;
        --field: rgba(255, 255, 255, 0.07);
        --field-border: rgba(243, 236, 226, 0.28);
        --accent: #f2c879;
        --accent-ink: #1d1a38;
        --glow: #f2a65a;
        --error: #ff9aa8;
        --ok: #8fe0b5;
      }
    }

    :root[data-theme="dark"] {
      --sky-top: #14152e;
      --sky-bottom: #4a2c58;
      --card: rgba(24, 22, 48, 0.72);
      --card-border: rgba(242, 200, 121, 0.22);
      --ink: #f3ece2;
      --ink-soft: #b9afcf;
      --field: rgba(255, 255, 255, 0.07);
      --field-border: rgba(243, 236, 226, 0.28);
      --accent: #f2c879;
      --accent-ink: #1d1a38;
      --glow: #f2a65a;
      --error: #ff9aa8;
      --ok: #8fe0b5;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      position: relative;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 24px 16px;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%) fixed;
      color: var(--ink);
      font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    /* A low sun on the horizon behind the card. */
    .sun {
      position: fixed;
      bottom: -140px;
      left: 50%;
      width: 420px;
      height: 420px;
      max-width: 90vw;
      max-height: 90vw;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        var(--glow) 0%,
        rgba(242, 166, 90, 0.45) 38%,
        rgba(242, 166, 90, 0) 70%
      );
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 40px 32px 32px;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand {
      margin: 0 0 6px;
      font-family: "Young Serif", Georgia, "Times New Roman", serif;
      font-size: 2.1rem;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 0.005em;
    }

    .sub {
      margin: 0 0 28px;
      color: var(--ink-soft);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
    }

    input::placeholder {
      color: var(--ink-soft);
      opacity: 0.8;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    input[aria-invalid="true"] {
      border-color: var(--error);
    }

    .pw-row {
      position: relative;
    }

    .pw-row input {
      padding-right: 76px;
    }

    .toggle {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--ink-soft);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .submit {
      width: 100%;
      margin-top: 6px;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .submit:hover {
      filter: brightness(1.08);
    }

    .submit:active {
      transform: translateY(1px);
    }

    .msg {
      min-height: 1.5em;
      margin: 16px 0 0;
      font-size: 0.95rem;
    }

    .msg.error {
      color: var(--error);
    }

    .msg.ok {
      color: var(--ok);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>

  <main class="card">
    <h1 class="brand">Evening Thoughts</h1>
    <p class="sub">Log in to continue.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="Enter your username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-row">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
          <button
            id="password-toggle"
            class="toggle"
            type="button"
            aria-label="Show password"
            aria-controls="password"
          >Show</button>
        </div>
      </div>

      <button class="submit" type="submit">Log in</button>
      <p id="form-message" class="msg" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("password-toggle");
    const loginForm = document.getElementById("login-form");
    const formMessage = document.getElementById("form-message");

    passwordToggle.addEventListener("click", () => {
      const showPassword = passwordInput.type === "password";
      passwordInput.type = showPassword ? "text" : "password";
      passwordToggle.textContent = showPassword ? "Hide" : "Show";
      passwordToggle.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
      );
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      usernameInput.removeAttribute("aria-invalid");
      passwordInput.removeAttribute("aria-invalid");
      formMessage.className = "msg";
      formMessage.textContent = "";

      if (!username) {
        usernameInput.setAttribute("aria-invalid", "true");
        formMessage.className = "msg error";
        formMessage.textContent = "Enter your username.";
        usernameInput.focus();
        return;
      }

      if (!password) {
        passwordInput.setAttribute("aria-invalid", "true");
        formMessage.className = "msg error";
        formMessage.textContent = "Enter your password.";
        passwordInput.focus();
        return;
      }

      // Demo only: there is no server, so nothing is checked or sent.
      formMessage.className = "msg ok";
      formMessage.textContent = `Welcome back, ${username}.`;
    });
  </script>
</body>
</html>
